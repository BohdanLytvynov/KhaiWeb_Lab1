<div class="cotainer justify-content-center">
    <div class="card">
        <div class="card-header">Login</div>
            <div class="card-body">
    
                <form>
                    <div class="form-group row">
                        <label for="login" class="col-md-4 col-form-label
                        text-md-right">Login
                        </label>

                        <div class="col-md-6">                            
                                <input #loginElem type="text" id="login" 
                                 [ngClass]="validator.GetValidArrayItem(0)? 
                                 'form-control is-valid' 
                                 : 'form-control is-invalid'" 
                                 name="login" autofocus [(ngModel)]="login"
                                (ngModelChange)="onLoginChanged(loginElem.value)">
                            
                                <div class="invalid-feedback">
                                    Please enter login!
                                </div>
                                <div class="valid-feedback">
                                    All correct!
                                </div>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="email_address" class="col-md-4 col-form-label
                        text-md-right">Password</label>
                            <div class="col-md-6">
                            
                                <input #password type="password" id="pass" 
                                [ngClass]="validator.GetValidArrayItem(1)? 
                                'form-control is-valid' : 'form-control is-invalid'"
                                name="pass" [(ngModel)]="pass"
                                (ngModelChange)="onPassChanged(password.value)">
                            
                            <div class="invalid-feedback">
                        Please enter password!
                            </div>
                            <div class="valid-feedback">
                                All correct!
                            </div>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-6 offset-md-4">
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="remember" 
                                    [(ngModel)]="rememberMe"> Remember Me
                                </label>
                            </div>
                        </div>
                    </div>
 
                    <div class="col-md-6 offset-md-4">

                        <button type="submit" 
                        [ngClass]="loginenable? 'btn btn-primary enabled' : 'btn btn-primary disabled'" 
                        id="login-button" (click)="onLoginPressed()">                        
                            Login
                        </button>
                        <a href="#" class="btn btn-link">
                            Forgot Your Password?
                        </a>
                    </div>
                    <div class="flex-container-rw just-center">
                        <div
                        [ngClass]="result.success? 'hide ' : 'err-msg-style'">
                            {{result.error}}
                        </div>
                    </div>
                    
                </form>

            </div>
    </div>
</div>
