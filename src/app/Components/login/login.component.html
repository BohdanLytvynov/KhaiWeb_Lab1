<div>
    <div class="form">
        <h1 class="header1">Login</h1>

        <div>
            <label for="login">Login: </label>
            <input type="text" name="login" [(ngModel)]="login">
        </div>

        <div>
            <label for="password">Password: </label>
            <input type="password" name="password" [(ngModel)]="pass">
        </div>

        <div class="buttons">
            <button class="simple-but" (click)="onLoginPressed()">Login</button>
            <button class="simple-but" (click)="onBackPressed()">Back</button>            
        </div>

    </div>

<div class="error-msg" *ngIf="!loginSuccess; else empty">
    {{error}}
</div>
<ng-template #empty></ng-template>

</div>
